<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="Sign in to Khelo and book a court." />
    <title>Khelo | Sign in</title>
    <link rel="stylesheet" href="/static/styles.css" />
  </head>
  <body>
    <main class="auth-page">
      <section class="auth-window" aria-labelledby="login-heading">
        <a class="wordmark" href="/">KHELO</a>
        <p class="form-kicker">COURTS AND GROUNDS, NEAR YOU</p>
        <h1 id="login-heading">Get in the game.</h1>
        <p class="form-intro">Book your next court or manage your venue.</p>

        <fieldset class="role-picker">
          <legend>Continue as</legend>
          <label><input type="radio" name="role" value="player" checked /> Player</label>
          <label><input type="radio" name="role" value="court_manager" /> Venue manager</label>
        </fieldset>

        <div class="auth-actions" aria-label="Account options">
          <a class="primary-button" href="/static/signup.html" id="signup-option">Sign up</a>
          <button class="secondary-button" type="button" id="show-login">Sign in</button>
          <button class="google-button" type="button" id="google-signin"><span class="google-g" aria-hidden="true">G</span> Sign in with Google</button>
        </div>

        <form id="login-form" class="hidden-form" novalidate>
          <label for="email">Email address</label>
          <input id="email" name="email" type="email" autocomplete="email" placeholder="you@example.com" required />
          <label for="password">Password</label>
          <input id="password" name="password" type="password" autocomplete="current-password" placeholder="Enter your password" required />
          <button class="primary-button" type="submit">Continue</button>
        </form>
        <p id="form-message" class="form-message" role="status"></p>
      </section>
    </main>
    <script src="/static/app.js"></script>
  </body>
</html>
