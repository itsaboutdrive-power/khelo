<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="Sign in to Khelo and book a court." />
    <title>Khelo | Sign in</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@600;700&family=DM+Sans:wght@400;500;600;700&display=swap" rel="stylesheet" />
    <link rel="stylesheet" href="/static/styles.css" />
  </head>
  <body>
    <main class="login-shell">
      <section class="brand-panel" aria-label="Khelo">
        <div class="brand-mark"><span></span><span></span><span></span></div>
        <p class="eyebrow">PLAY YOUR CITY</p>
        <h1>KHELO</h1>
        <p class="brand-copy">Find a court. Pick a time. Get in the game.</p>
        <div class="court-lines" aria-hidden="true"></div>
        <p class="location-label">YOUR NEXT MATCH STARTS HERE</p>
      </section>

      <section class="form-panel" aria-labelledby="login-heading">
        <div class="form-wrap">
          <p class="khelo-mobile">KHELO</p>
          <p class="form-kicker">WELCOME BACK</p>
          <h2 id="login-heading">Ready to play?</h2>
          <p class="form-intro">Sign in to manage your bookings and find your next game.</p>

          <form id="login-form">
            <label for="email">Email address</label>
            <input id="email" name="email" type="email" autocomplete="email" placeholder="you@example.com" required />

            <div class="password-label">
              <label for="password">Password</label>
              <a href="#">Forgot password?</a>
            </div>
            <input id="password" name="password" type="password" autocomplete="current-password" placeholder="Enter your password" required />

            <button class="primary-button" type="submit">Sign in</button>
          </form>

          <div class="divider"><span>OR</span></div>
          <button class="google-button" type="button" disabled title="Google OAuth will be connected next">
            <span class="google-g" aria-hidden="true">G</span>
            Continue with Google
          </button>
          <p class="signup-prompt">New to Khelo? <a href="/static/signup.html">Create an account</a></p>
          <p id="form-message" class="form-message" role="status"></p>
        </div>
      </section>
    </main>
    <script src="/static/app.js"></script>
  </body>
</html>
