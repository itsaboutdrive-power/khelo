<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Khelo | Available courts</title>
    <link rel="stylesheet" href="/static/styles.css" />
  </head>
  <body>
    <main class="browse-page">
      <header class="browse-header"><a class="wordmark" href="/">KHELO</a><p>Courts free near you</p></header>
      <section class="browse-content" aria-labelledby="browse-heading">
        <p class="form-kicker">LIVE AVAILABILITY</p>
        <h2 id="browse-heading">Find your court</h2>
        <form id="venue-filters" class="filters">
          <label for="sport-filters">Sports</label>
          <select id="sport-filters" multiple aria-label="Select one or more sports"></select>
          <label for="price-sort">Sort</label>
          <select id="price-sort">
            <option value="">Nearest available</option>
            <option value="low_to_high">Price: low to high</option>
            <option value="high_to_low">Price: high to low</option>
          </select>
        </form>
        <p id="form-message" class="form-message" role="status"></p>
        <section id="venue-results" class="venue-results" aria-live="polite"><p>Finding available courts near you...</p></section>
        <section id="venue-detail" class="venue-detail hidden" aria-live="polite">
          <div class="detail-heading">
            <div>
              <p class="form-kicker">SELECTED VENUE</p>
              <h3 id="selected-venue-name"></h3>
              <p id="selected-venue-address"></p>
            </div>
            <a id="selected-venue-map" target="_blank" rel="noreferrer">Open map</a>
          </div>
          <div class="detail-grid">
            <section>
              <p class="detail-label">TODAY'S SLOTS</p>
              <p id="availability-message" class="detail-message"></p>
              <div id="venue-slots" class="venue-slots"></div>
            </section>
            <section>
              <p class="detail-label">COMMUNITY RATINGS</p>
              <p id="ratings-message" class="detail-message"></p>
              <div id="venue-ratings" class="venue-ratings"></div>
            </section>
          </div>
        </section>
      </section>
    </main>
    <script src="/static/app.js"></script>
  </body>
</html>
