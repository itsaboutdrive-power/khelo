<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Khelo | Create account</title>
    <link rel="stylesheet" href="/static/styles.css" />
  </head>
  <body>
    <main class="simple-page">
      <div class="form-wrap">
        <p class="khelo-mobile">KHELO</p>
        <p class="form-kicker">JOIN THE GAME</p>
        <h2>Create your account</h2>
        <p class="form-intro">Start booking courts or register your own venue.</p>
        <form id="signup-form">
          <label for="signup-email">Email address</label>
          <input id="signup-email" type="email" required autocomplete="email" placeholder="you@example.com" />
          <label for="signup-password">Password</label>
          <input id="signup-password" type="password" minlength="8" required autocomplete="new-password" placeholder="At least 8 characters" />
          <label for="signup-role">I am signing up as</label>
          <select id="signup-role">
            <option value="player">Player</option>
            <option value="court_manager">Court manager</option>
          </select>
          <button class="primary-button" type="submit">Create account</button>
        </form>
        <p id="form-message" class="form-message" role="status"></p>
        <p class="signup-prompt"><a href="/">Back to sign in</a></p>
      </div>
    </main>
    <script src="/static/app.js"></script>
  </body>
</html>
